# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.

# Basic Site Settings
locale                   : "en-Michigan, US"
site_theme               : "default" # Options: "default", "air", "sunrise", "mint", "dirt", "contrast"
title                    : "Dr. Debrupa Chatterjee"
title_separator          : "|"
name                     : &name "Debrupa Chatterjee"
description              : &description "PhD in Geoinformatics | Water Resources | Remote Sensing | GIS Analyst & Geospatial Data Scientist"
url                      : "https://drdebrupachatterjee.github.io"
baseurl                  : ""
repository               : "drdebrupachatterjee/drdebrupachatterjee.github.io"

# Site Author - Controls what appears in the left-hand sidebar.
author:
  # Biographic information
  avatar                 : "1180.jpg"
  name                   : "Debrupa Chatterjee, Ph.D."
  pronouns               : ""
  bio                    : "Geospatial researcher specializing in water resources, ecological drought, remote sensing, and spatial analysis."
  location               : "United States"
  employer               : "Geospatial Researcher"
  uri                    :
  email                  : "debrupa.siu@gmail.com" # Add your email here if you want it displayed in the sidebar

  # Academic websites
  academia               :
  arxiv                  :
  googlescholar          : "https://scholar.google.com/citations?hl=en&user=3vOMfewAAAAJ&view_op=list_works&sortby=pubdate"
  inspire-hep            :
  impactstory            :
  orcid                  : "https://orcid.org/0000-0002-3779-3206" # Replace with your exact ORCID link
  semantic               :
  ssrn                   :
  pubmed                 :
  researchgate           : "https://www.researchgate.net/profile/Debrupa-Chatterjee?ev=hdr_xprf"
  scopus                 :
  zotero                 :

  # Repositories and software development
  bitbucket              :
  codepen                :
  dribbble               :
  github                 : "drdebrupachatterjee"
  kaggle                 :
  stackoverflow          :

  # Social media
  artstation             :
  bluesky                :
  facebook               :
  flickr                 :
  foursquare             :
  goodreads              :
  google_plus            :
  keybase                :
  instagram              :
  lastfm                 :
  linkedin               :
  mastodon               :
  medium                 :
  pinterest              :
  soundcloud             :
  steam                  :
  telegram               :
  tumblr                 :
  twitter                :
  vine                   :
  weibo                  :
  wikipedia              :
  xing                   :
  youtube                :
  zhihu                  :

# Publication Category
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "main"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:
  hide                   : false
  path                   :

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
og_description           :

social:
  type                   : Person
  name                   :
  links                  :

# Analytics
analytics:
  provider               : "false"
  google:
    tracking_id          :

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
